apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-service.observability.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: PostgreSQL
        type: postgres
        uid: postgres
        access: proxy
        url: postgres.default.svc.cluster.local:5432
        user: m_ai
        editable: false
        jsonData:
          database: m_ai
          sslmode: disable
        secureJsonData:
          password: $__env{POSTGRES_PASSWORD}
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: observability
data:
  registry.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: registry
        folder: Node filesystem
        interval: 1m
        rules:
          # Temporary rule for verifying Grafana alert provisioning.
          - uid: test-always-firing
            title: "TEST: Always firing alert"
            condition: B
            for: 0s
            noDataState: Alerting
            execErrState: Alerting
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  expr: vector(1)
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  type: threshold
                  refId: B
                  conditions:
                    - type: query
                      evaluator:
                        type: gt
                        params: [0]
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        type: last
                        params: []
          - uid: docker-registry-down
            title: Docker registry is down
            condition: B
            for: 2m
            noDataState: Alerting
            execErrState: Alerting
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  expr: docker_registry_running
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  type: threshold
                  refId: B
                  conditions:
                    - type: query
                      evaluator:
                        type: lt
                        params: [1]
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        type: last
                        params: []
          - uid: docker-registry-no-tags
            title: m-ai Docker registry has no tags
            condition: B
            for: 2m
            noDataState: Alerting
            execErrState: Alerting
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  expr: docker_registry_tag_count{repository="m-ai"}
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  type: threshold
                  refId: B
                  conditions:
                    - type: query
                      evaluator:
                        type: lt
                        params: [1]
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        type: last
                        params: []
          - uid: root-filesystem-usage-high
            title: Root filesystem usage is high
            condition: B
            for: 5m
            noDataState: NoData
            execErrState: Alerting
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  expr: 100 * (1 - node_filesystem_avail_bytes{host!="",mountpoint="/"} / node_filesystem_size_bytes{host!="",mountpoint="/"})
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  type: threshold
                  refId: B
                  conditions:
                    - type: query
                      evaluator:
                        type: gt
                        params: [85]
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        type: last
                        params: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      nodeSelector:
        m-ai/observability: "true"
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Editor"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: postgres-password
                  name: postgres-auth
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: grafana-alerting
              mountPath: /etc/grafana/provisioning/alerting
              readOnly: true
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-alerting
          configMap:
            name: grafana-alerting
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
