apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-operator
  namespace: observability
  labels:
    k8s-app: prometheus-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: prometheus-operator
  template:
    metadata:
      labels:
        k8s-app: prometheus-operator
    spec:
      nodeSelector:
        m-ai/observability: "true"
      serviceAccountName: prometheus-operator
      containers:
        - name: prometheus-operator
          image: quay.io/prometheus-operator/prometheus-operator:v0.93.1
          args:
            - --kubelet-service=kube-system/kubelet
            - --localhost=127.0.0.1
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-operator
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-operator-role
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["*"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources:
      [
        "nodes",
        "namespaces",
        "services",
        "endpoints",
        "pods",
        "secrets",
        "configmaps",
      ]
    verbs: ["*"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-operator-role
subjects:
  - kind: ServiceAccount
    name: prometheus-operator
    namespace: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-k8s
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-k8s
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-k8s
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: observability
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: observability
spec:
  retention: 15d
  retentionSize: 8GB
  serviceAccountName: prometheus-k8s
  replicas: 1
  image: quay.io/prometheus/prometheus:v3.14.0
  nodeSelector:
    m-ai/observability: "true"
  securityContext:
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
  initContainers:
    - name: initialize-storage
      image: busybox:1.37
      command:
        - sh
        - -ec
        - mkdir -p /storage/prometheus-db && chown 65534:65534 /storage/prometheus-db
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: prometheus-prometheus-db
          mountPath: /storage
  storage:
    volumeClaimTemplate:
      metadata:
        labels:
          m-ai/storage: prometheus
      spec:
        storageClassName: manual
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        selector:
          matchLabels:
            m-ai/storage: prometheus
  serviceMonitorNamespaceSelector: {}
  serviceMonitorSelector:
    matchLabels:
      release: prometheus-stack
  resources:
    requests:
      memory: 400Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: observability
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    prometheus: prometheus
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki-monitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: loki
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: m-ai-daemon-monitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: m-ai-daemon
  endpoints:
    - port: metrics
      path: /prometheus/metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-node-exporter-monitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - default
  serviceDiscoveryRole: EndpointSlice
  selector:
    matchLabels:
      k8s-app: node-exporter
  endpoints:
    - port: metrics-9100
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpointslice_endpoint_hostname
          targetLabel: host
    - port: metrics-9200
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpointslice_endpoint_hostname
          targetLabel: host
    - port: metrics-9300
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpointslice_endpoint_hostname
          targetLabel: host
    - port: metrics-9400
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpointslice_endpoint_hostname
          targetLabel: host
---
apiVersion: v1
kind: Service
metadata:
  name: external-node-exporter
  namespace: default
  labels:
    k8s-app: node-exporter
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
