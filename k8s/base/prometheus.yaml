apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-operator
  namespace: observability
  labels:
    k8s-app: prometheus-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: prometheus-operator
  template:
    metadata:
      labels:
        k8s-app: prometheus-operator
    spec:
      nodeSelector:
        m-ai/observability: "true"
      serviceAccountName: prometheus-operator
      containers:
        - name: prometheus-operator
          image: quay.io/prometheus-operator/prometheus-operator:v0.93.1
          args:
            - --kubelet-service=kube-system/kubelet
            - --localhost=127.0.0.1
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-operator
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-operator-role
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["*"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources:
      [
        "nodes",
        "namespaces",
        "services",
        "endpoints",
        "pods",
        "secrets",
        "configmaps",
      ]
    verbs: ["*"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-operator-role
subjects:
  - kind: ServiceAccount
    name: prometheus-operator
    namespace: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-k8s
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-k8s
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-k8s
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: observability
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: observability
spec:
  # The active TSDB/WAL uses the pod's ephemeral storage. Compacted blocks are
  # uploaded to MinIO by the Thanos sidecar.
  retention: 24h
  serviceAccountName: prometheus-k8s
  replicas: 1
  image: quay.io/prometheus/prometheus:v3.14.0
  externalLabels:
    cluster: m-ai
  nodeSelector:
    m-ai/observability: "true"
  securityContext:
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
  thanos:
    image: quay.io/thanos/thanos:v0.39.2
    objectStorageConfig:
      name: thanos-objstore
      key: objstore.yml
  serviceMonitorNamespaceSelector: {}
  serviceMonitorSelector:
    matchLabels:
      release: prometheus-stack
  resources:
    requests:
      memory: 400Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: observability
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    prometheus: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-sidecar
  namespace: observability
spec:
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
  selector:
    prometheus: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-store
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thanos-store
  template:
    metadata:
      labels:
        app: thanos-store
    spec:
      nodeSelector:
        m-ai/observability: "true"
      containers:
        - name: thanos-store
          image: quay.io/thanos/thanos:v0.39.2
          args:
            - store
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore.yml
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
          volumeMounts:
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
            - name: data
              mountPath: /var/thanos/store
      volumes:
        - name: objstore
          secret:
            secretName: thanos-objstore
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  namespace: observability
spec:
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
  selector:
    app: thanos-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-compactor
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thanos-compactor
  template:
    metadata:
      labels:
        app: thanos-compactor
    spec:
      nodeSelector:
        m-ai/observability: "true"
      containers:
        - name: thanos-compactor
          image: quay.io/thanos/thanos:v0.39.2
          args:
            - compact
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --retention.resolution-raw=15d
            - --wait
          volumeMounts:
            - name: objstore
              mountPath: /etc/thanos
              readOnly: true
            - name: data
              mountPath: /var/thanos/compact
      volumes:
        - name: objstore
          secret:
            secretName: thanos-objstore
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thanos-query
  template:
    metadata:
      labels:
        app: thanos-query
    spec:
      nodeSelector:
        m-ai/observability: "true"
      containers:
        - name: thanos-query
          image: quay.io/thanos/thanos:v0.39.2
          args:
            - query
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --endpoint=thanos-sidecar.observability.svc.cluster.local:10901
            - --endpoint=thanos-store.observability.svc.cluster.local:10901
          ports:
            - name: http
              containerPort: 10902
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: observability
spec:
  ports:
    - name: http
      port: 10902
      targetPort: http
  selector:
    app: thanos-query
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki-monitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: loki
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: m-ai-daemon-monitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: m-ai-daemon
  endpoints:
    - port: metrics
      path: /prometheus/metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-node-exporter-monitor
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - default
  serviceDiscoveryRole: EndpointSlice
  selector:
    matchLabels:
      k8s-app: node-exporter
  endpoints:
    - port: metrics-9100
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpointslice_endpoint_hostname
          targetLabel: host
    - port: metrics-9200
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpointslice_endpoint_hostname
          targetLabel: host
    - port: metrics-9300
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpointslice_endpoint_hostname
          targetLabel: host
    - port: metrics-9400
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpointslice_endpoint_hostname
          targetLabel: host
    - port: metrics-9500
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpointslice_endpoint_hostname
          targetLabel: host
    - port: metrics-9600
      interval: 15s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpointslice_endpoint_hostname
          targetLabel: host
---
apiVersion: v1
kind: Service
metadata:
  name: external-node-exporter
  namespace: default
  labels:
    k8s-app: node-exporter
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
